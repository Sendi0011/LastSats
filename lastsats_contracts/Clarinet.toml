[project]
name = 'lastsats_contracts'
description = ''
authors = []
telemetry = true
cache_dir = './.cache'

# The vaults call sBTC by absolute principal, so the static analyser needs those
# contracts resolvable as requirements. (At runtime the vault talks to the
# actually deployed contract on mainnet/testnet.)
#
# NOTE: these ABIs are hand-maintained in .cache/requirements. The real
# mainnet sBTC ABI is not fetchable from the public API, so the SIP-010
# surface is declared locally. Re-run `clarinet check` after any token
# interface change.
[[project.requirements]]
contract_id = 'SN3VMHXEN64ZZF71JQ5VESXDWTR301XTTXGF4J8F1.sbtc-token'

[[project.requirements]]
contract_id = 'ST1JY6A22J1DXWACXWPR95HZQR72FAP3J835MKFC2.sbtc-mock-token'

[contracts.sbtc-mock-token]
path = 'contracts/sbtc-mock-token.clar'
clarity_version = 3
epoch = 'latest'

[contracts.lastsats-vault-v2]
path = 'contracts/lastsats-vault-v2.clar'
clarity_version = 2
epoch = 'latest'

[contracts.lastsats-vault-v3]
path = 'contracts/lastsats-vault-v3.clar'
clarity_version = 2
epoch = 'latest'

# v4/v5 were deployed during bring-up of the event index (v4 had an
# arithmetic underflow in get-vault-events on an empty history, v5 fixed it
# but kept a misleading doc comment). v6 is canonical; the earlier ones are
# retained as deployed artefacts only.
[contracts.lastsats-vault-v6]
path = 'contracts/lastsats-vault-v6.clar'
clarity_version = 2
epoch = 'latest'
