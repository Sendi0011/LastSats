[project]
name = 'lastsats_contracts'
description = ''
authors = []
telemetry = true
cache_dir = './.cache'

# lastsats-vault-v2 calls the real sBTC token by absolute principal, so the
# static analyser needs real sBTC available as a requirement. (At runtime v2
# talks to the actual deployed sBTC contract on mainnet/testnet.)
[[project.requirements]]
contract_id = 'SN3VMHXEN64ZZF71JQ5VESXDWTR301XTTXGF4J8F1.sbtc-token'

[contracts.sbtc-mock-token]
path = 'contracts/sbtc-mock-token.clar'
clarity_version = 3
epoch = 'latest'

[contracts.lastsats-vault-v2]
path = 'contracts/lastsats-vault-v2.clar'
clarity_version = 2
epoch = 'latest'

[contracts.lastsats-vault-v3]
path = 'contracts/lastsats-vault-v3.clar'
clarity_version = 2
epoch = 'latest'
